# 에피스테믹 워크스페이스 기계 감사 (CI 연동).
# AGENTS/epistemic-rules/tools/audit.py를 push, pull request 시점에 실행한다.
# 스크립트 자체는 도구 중립(Python 표준 라이브러리만)이며, 상세는 AGENTS/epistemic-rules/tools.md 참조.
name: epistemic-audit

on:
  pull_request:
  push:
    branches: [main]

# 감사는 읽기 전용이다. 기본 토큰 권한 상속 대신 최소 권한만 명시한다.
permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      # 액션은 주 판으로 고정한다. 주 판 안의 수정판은 따라가고, 동작이 바뀔 수 있는
      # 주 판 변경은 이 파일을 고쳐 받는다.
      - uses: actions/checkout@v7
      # 파이썬 인터프리터를 명시적으로 확보한다. tools.md의 크로스
      # 플랫폼 실행 안내(python/py)와 정합 - 러너 기본 python3에 암묵 의존하지 않는다.
      # 판은 3.x 최신으로 두지 않고 부 판까지 고정해 새 판이 나와도 같은 판에서 감사한다.
      # 도구가 지원하는 최소 판(3.9)은 tools.md "기계 감사 스크립트"에 있다.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Run mechanical audit
        shell: bash
        run: |
          # 감사 결과를 job summary로 노출한다 - 초록 체크만으로는 경고가 안 보인다.
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          python AGENTS/epistemic-rules/tools/audit.py . | tee -a "$GITHUB_STEP_SUMMARY"
          status=${PIPESTATUS[0]}
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
